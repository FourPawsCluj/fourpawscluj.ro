<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#888;font-family:"DM Sans",sans-serif}
.ab{position:relative;overflow:hidden;margin:0 0 40px;background:#FBF3E6 url(map.png) center/cover no-repeat}
.ab::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,247,240,.0),rgba(255,247,240,.0))}
.card{position:absolute;background:#FFF7F0;border-radius:36px;box-shadow:0 20px 60px rgba(27,47,4,.18)}
h1{font:800 64px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;color:#1B2F04;margin:0}
h1 em{font-style:normal;background:#C1F585;padding:0 .1em;border-radius:.18em;white-space:nowrap}
.logo{display:flex;align-items:center;gap:12px;font:800 28px "Bricolage Grotesque";color:#1B2F04}
.logo b{width:48px;height:48px;border-radius:50%;background:#C1F585;display:grid;place-items:center}
.wa{display:inline-block;background:#FF8200;color:#fff;font-weight:700;border-radius:999px}
.ph{position:absolute;border-radius:50%;overflow:hidden;border:10px solid #C1F585;box-shadow:0 20px 50px rgba(27,47,4,.25)}
.ph img{width:100%;height:100%;object-fit:cover}
/* facebook cover 1640x624: keep content in the centre ~1100px (phones crop the sides) */
#fb{width:1640px;height:624px}
#fb .card{left:300px;top:120px;width:700px;height:384px;padding:44px 48px;box-sizing:border-box}
#fb h1{margin:28px 0 30px}
#fb .wa{font-size:28px;padding:14px 28px}
#fb .ph{left:1030px;top:92px;width:420px;height:420px}
/* linkedin page cover 2256x382 (1128x191 @2x): logo sits bottom-left, so content goes right */
#li{width:2256px;height:382px}
#li .card{right:120px;top:56px;width:1180px;height:270px;padding:40px 52px;box-sizing:border-box;display:flex;align-items:center;gap:44px}
#li h1{font-size:62px}
#li .wa{font-size:30px;padding:14px 28px;margin-top:22px}
#li .ph{position:relative;flex:none;width:200px;height:200px;border-width:8px;box-shadow:none}
/* profile photo 1080x1080 */
#pp{width:1080px;height:1080px;background:#C1F585}
#pp img{width:100%;height:100%;object-fit:cover;transform:scale(1.45);transform-origin:50% 30%}
</style></head><body>
<div class="ab" id="fb">
  <div class="card"><div class="logo"><b><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#1B2F04" d="M12 13.5c-2.6 0-5.5 2.6-5.5 5 0 1.6 1.3 2.5 2.8 2.5 1.2 0 1.8-.6 2.7-.6s1.5.6 2.7.6c1.5 0 2.8-.9 2.8-2.5 0-2.4-2.9-5-5.5-5ZM6.2 12.3c1.3-.4 1.9-2 1.4-3.5-.5-1.6-1.9-2.5-3.2-2.1-1.3.4-1.9 2-1.4 3.5.5 1.6 1.9 2.5 3.2 2.1Zm11.6 0c1.3.4 2.7-.5 3.2-2.1.5-1.5-.1-3.1-1.4-3.5-1.3-.4-2.7.5-3.2 2.1-.5 1.5.1 3.1 1.4 3.5ZM9.4 8.4c1.4 0 2.4-1.5 2.4-3.3S10.8 2 9.4 2 7 3.4 7 5.1s1 3.3 2.4 3.3Zm5.2 0c1.4 0 2.4-1.5 2.4-3.3S16 2 14.6 2s-2.4 1.4-2.4 3.1 1 3.3 2.4 3.3Z"/></svg></b>Four Paws Cluj</div>
  <h1>Plimbări pentru câini în <em>Cluj-Napoca</em></h1>
  <span class="wa">WhatsApp 0746 048 445</span></div>
  <div class="ph"><img src="hero.webp"></div>
</div>
<div class="ab" id="li">
  <div class="card"><div class="ph"><img src="hero.webp"></div>
  <div><h1>Plimbări pentru câini în <em>Cluj-Napoca</em></h1><span class="wa">fourpawscluj.ro · 0746 048 445</span></div></div>
</div>
<div class="ab" id="pp"><img src="hero.png"></div>
</body></html>
